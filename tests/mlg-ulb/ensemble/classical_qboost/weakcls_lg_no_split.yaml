algorithm: classical_qboost
classifier:
  lambda_coef: 0.0
  num_samples: 1
  relaxation_schedule: 2
  weak_cls_schedule: 1
  weak_cls_strategy: sequential
  weak_cls_type: lg
  weak_cls_params:
    penalty: l2
    solver: lbfgs
    C: 10
data:
  # --- paths ---
  train_file: data\mlg-ulb\creditcard.csv
  test_file: null
  model_file: null
  model_name_override: "ensemble classical lg 1k oversample no split"
  index_column: id
  class_name: Class

  # --- feature selection ---
  v_feature_names: []
  engineered_feature_names:
  - Comp_Sum
  - Comp_Min
  - Comp_Max
  - Comp_Avg
  - Comp_Std
  - Comp_Pos
  - Comp_Neg
  - Comp_Var
  additional_feature_names:
  - Amount
  - Time

  # --- sampling / class balance ---
  enforce_equal_samples: false
  max_non_fraud_samples: null
  max_fraud_samples: null
  class_balance_ratio: null
  max_total_samples: null

  # --- oversampling ---
  should_over_sample: true
  oversample_method: "smote"
  oversample_ratio: 1.0

  # --- split ---
  test_size: 0.3
  split_method: "random"
  time_column: "Time"
  preserve_natural_test_distribution: true

  # --- data quality ---
  drop_duplicates: false
  log_transform_amount: false
  amount_column: "Amount"
  feature_scaling: "none"

  # --- reproducibility ---
  random_state: 42
  sample_random_state: null
  split_random_state: null
  oversample_random_state: null
