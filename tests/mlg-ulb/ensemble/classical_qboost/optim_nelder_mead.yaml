algorithm: classical_qboost
classifier:
  optimization_method: "Nelder-Mead"
  lambda_coef: 0.0
  num_samples: 1
  weak_cls_schedule: 1
  weak_cls_strategy: sequential
  weak_cls_type: lg
  weak_cls_params:
    penalty: l2
    solver: lbfgs
    C: 10
data:
  additional_feature_names:
  - Amount
  - Time
  class_name: Class
  enforce_equal_samples: true
  engineered_feature_names:
  - Comp_Sum
  - Comp_Min
  - Comp_Max
  - Comp_Avg
  - Comp_Std
  - Comp_Pos
  - Comp_Neg
  - Comp_Var
  index_column: id
  model_file: null
  model_name_override: "classical nelder-mead 1k oversample"
  non_fraud_sample_size: 1000
  over_sample_percentage: 1.0
  random_state: 42
  should_over_sample: true
  test_file: data\mlg-ulb\test.csv
  test_size: 0.3
  train_file: data\mlg-ulb\train.csv
  v_feature_names: []
