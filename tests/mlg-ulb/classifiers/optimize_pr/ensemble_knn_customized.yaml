algorithm: classical_qboost
classifier:
  optimization_method: "L-BFGS-B"   # cosmetic label only — see note below
  lambda_coef: 0.0                   # paper's actual setting (Table 2: "λ ... fixed at ... 0")
  num_samples: 1
  weak_cls_schedule: 2               # paper's actual setting
  weak_cls_strategy: sequential      # required on Windows; safe (just possibly slower) elsewhere
  weak_cls_type: knn
  weak_cls_params:
    n_neighbors: 15
    weights: uniform
    p: 2
    leaf_size: 30
    metric: minkowski
  max_iter: 1000
  tol: 1e-8
data:
  train_file: data\mlg-ulb\train.csv
  test_file: data\mlg-ulb\test.csv
  model_file: null
  model_name_override: "classical qboost knn schedule2 lambda0.0 - full dataset"
  index_column: id
  class_name: Class

  v_feature_names: []
  engineered_feature_names:
  - Comp_Sum
  - Comp_Min
  - Comp_Max
  - Comp_Avg
  - Comp_Std
  - Comp_Pos
  - Comp_Neg
  - Comp_Var
  additional_feature_names:
  - Amount
  - Time

  enforce_equal_samples: false
  max_non_fraud_samples: null
  max_fraud_samples: null
  class_balance_ratio: null
  max_total_samples: null

  should_over_sample: true
  oversample_method: "smote"
  oversample_ratio: 1.0

  test_size: 0.3
  split_method: "random"
  time_column: "Time"
  preserve_natural_test_distribution: true

  drop_duplicates: false
  log_transform_amount: false
  amount_column: "Amount"
  feature_scaling: "minmax"

  random_state: 42
  sample_random_state: null
  split_random_state: null
  oversample_random_state: null