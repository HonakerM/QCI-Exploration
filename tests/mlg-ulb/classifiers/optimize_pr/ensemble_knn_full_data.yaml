algorithm: classical_qboost
classifier:
  relaxation_schedule: 2      # unused by the classical solver, kept for parity
  num_samples: 1               # unused by the classical solver, kept for parity
  lambda_coef: 0.0             # matches paper: "λ ... fixed at 2 and 0 respectively"
  weak_cls_strategy: "sequential"
  weak_cls_type: "knn"
  weak_cls_schedule: 2         # CRITICAL: paper fixes this at 2, not the code's default of 1
  weak_cls_params:
    n_neighbors: 15
    weights: "uniform"
    p: 2
    leaf_size: 30
    metric: "minkowski"
  optimization_method: "L-BFGS-B"
  max_iter: 1000
  tol: 1e-8
data:
  train_file: data\mlg-ulb\creditcard.csv
  test_file: null
  model_file: null
  model_name_override: "classical qboost knn - schedule 2 - paper full data"
  index_column: id
  class_name: Class

  v_feature_names: []
  engineered_feature_names: []   # see note below
  additional_feature_names:
  - Amount
  - Time

  enforce_equal_samples: false
  max_non_fraud_samples: null
  max_fraud_samples: null
  class_balance_ratio: null
  max_total_samples: null

  should_over_sample: true
  oversample_method: "smote"
  oversample_ratio: 1.0

  test_size: 0.3
  split_method: "random"
  preserve_natural_test_distribution: true

  drop_duplicates: false
  log_transform_amount: false
  feature_scaling: "minmax"      # paper: "features were scaled to a representation between [0, 1]"

  random_state: 42
  sample_random_state: null
  split_random_state: null
  oversample_random_state: null