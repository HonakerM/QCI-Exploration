algorithm: xgboost
classifier:
    n_estimators: 6000
    min_child_weight: 96
    max_depth: 12
    learning_rate: 0.07516
    subsample: 0.95
    colsample_bytree: 0.95
    reg_lambda: 1.5
    reg_alpha: 1.5
    gamma: 1.5
    max_bin: 512
    random_state: 228
    objective: "binary:logistic"
    tree_method: "auto"
    eval_metric: "auc"
data:
  # --- paths ---
  train_file: data\mlg-ulb\train.csv
  test_file: data\mlg-ulb\test.csv
  model_file: null
  model_name_override: "xgboost - many estimators"
  index_column: id
  class_name: Class

  # --- feature selection ---
  v_feature_names: []
  engineered_feature_names:
  - Comp_Sum
  - Comp_Min
  - Comp_Max
  - Comp_Avg
  - Comp_Std
  - Comp_Pos
  - Comp_Neg
  - Comp_Var
  additional_feature_names:
  - Amount
  - Time

  # --- sampling / class balance ---
  enforce_equal_samples: true
  max_non_fraud_samples: 1000
  max_fraud_samples: null
  class_balance_ratio: null
  max_total_samples: null

  # --- oversampling ---
  should_over_sample: true
  oversample_method: "smote"
  oversample_ratio: 1.0

  # --- split ---
  test_size: 0.3
  split_method: "random"
  time_column: "Time"
  preserve_natural_test_distribution: false

  # --- data quality ---
  drop_duplicates: false
  log_transform_amount: false
  amount_column: "Amount"
  feature_scaling: "none"

  # --- reproducibility ---
  random_state: 42
  sample_random_state: null
  split_random_state: null
  oversample_random_state: null
